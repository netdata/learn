# section: static << START

[build]
  command = "npm run build:netlify"
  publish = "build"
  environment = { NPM_VERSION = "10.9.8", NODE_VERSION = "22.23.2", NODE_OPTIONS = "--max-old-space-size=3072", DOCUSAURUS_SSR_CONCURRENCY = "4"}

[[plugins]]
  package = "./plugins/netlify-plugin-indexnow"

  [plugins.inputs]
    host = "learn.netdata.cloud"
    key = "69893e732658435694bf647d5a6fed1d"
    keyLocation = "https://learn.netdata.cloud/69893e732658435694bf647d5a6fed1d.txt"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Link = '<https://learn.netdata.cloud/docs/welcome-to-netdata/complete-product-description>; rel="canonical"'


