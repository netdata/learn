version: 2
updates:
  # Root package.json and yarn.lock are the Learn JavaScript dependency authority.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      css-toolchain:
        applies-to: version-updates
        patterns:
          - "@tailwindcss/*"
          - tailwindcss
          - autoprefixer
          - postcss
          - "postcss-*"
        update-types:
          - minor
          - patch
      javascript-build-parser:
        applies-to: version-updates
        patterns:
          - "@babel/*"
          - acorn
          - dotenv
          - parse5
          - typescript
          - webpack
        update-types:
          - minor
          - patch
      test-runtime:
        applies-to: version-updates
        patterns:
          - "@testing-library/*"
          - "@vitejs/*"
          - "@vitest/*"
          - happy-dom
          - jsdom
          - vite
          - vitest
        update-types:
          - minor
          - patch
      browser-runtime:
        applies-to: version-updates
        patterns:
          - "@types/react"
          - axios
          - mermaid
          - react
          - react-dom
          - react-inlinesvg
        update-types:
          - minor
          - patch
      docusaurus-renderer:
        applies-to: version-updates
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/docusaurus-search-local"
          - "@mdx-js/*"
          - posthog-docusaurus
        update-types:
          - minor
          - patch
      # Security updates ignore the schedule and are not covered by the groups
      # above. A dependency joins the first group it matches: packages that ship
      # to visitors' browsers need a visual check, everything else only a build.
      # No update-types filter: a fix may require a major version.
      security-browser:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - react-inlinesvg
          - mermaid
          - dompurify
          - swagger-ui
          - swagger-ui-dist
          - "@easyops-cn/*"
          - posthog-docusaurus
      security-build:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"

  # The ingest runtime is independently hash-locked and tested on Python 3.13.
  - package-ecosystem: pip
    directory: "/.learn_environment"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-python:
        applies-to: security-updates
        patterns:
          - "*"
